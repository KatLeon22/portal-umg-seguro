# Terminación TLS en producción (proxy inverso delante de la aplicación)
server {
    listen 80;
    server_name portal.example.edu.gt;
    return 301 https://$host$request_uri;          # todo HTTP se redirige a HTTPS
}
server {
    listen 443 ssl http2;
    server_name portal.example.edu.gt;
    server_tokens off;                             # no revela la versión de Nginx
    proxy_hide_header Server;
    ssl_certificate     /etc/letsencrypt/live/portal.example.edu.gt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.edu.gt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header X-Forwarded-Proto https;
    }
}
