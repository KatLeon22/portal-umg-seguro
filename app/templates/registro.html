{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<h1>Registro de estudiante</h1>
<form method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" maxlength="254" required></label>
  <label>Carné <input name="carnet" pattern="\d{4}-\d{2}-\d{1,6}" required></label>
  <label>Contraseña (12 a 128 caracteres) <input type="password" name="password" minlength="12" maxlength="128" required></label>
  <button type="submit">Registrarme</button>
</form>
{% endblock %}
